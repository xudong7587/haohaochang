plugins { id 'com.android.application' }
android {
    namespace 'home.haohaochang.tv'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'home.haohaochang.tv'
        minSdk 23
        targetSdk 28
        versionCode 19
        versionName '0.4.1'
    }
    signingConfigs {
        release {
            if (System.getenv('TV_KEYSTORE_FILE')) {
                storeFile file(System.getenv('TV_KEYSTORE_FILE'))
                storeType 'PKCS12'
                storePassword System.getenv('TV_KEYSTORE_PASSWORD')
                keyAlias 'haohaochang'
                keyPassword System.getenv('TV_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    // Distributed directly to home TVs, not Google Play. Keep the existing TV
    // behavior target; all other release lint checks remain enabled.
    lint { disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}
