# Linux NAS 统一配置：docker compose up -d
# 升级时沿用原密码、端口和目录。PC 自动发现需要 host 网络。
services:
  ktv:
    image: ghcr.io/xudong7587/haohaochang:latest
    network_mode: host
    environment:
      ADMIN_PASSWORD: "change-this-password-123"
      PORT: "43210" # 升级时填写原 NAS 访问端口，如 3210
      KTV_DISCOVERY_ENABLED: "1"
      KTV_TV_DISCOVERY_ENABLED: "1"
    volumes:
      - ./data:/data
      - /volume3/V3 Media/Haohaochang/media:/media
      - /volume3/V3 Media/Haohaochang/download:/download
      # 没有 NPU 时目录可为空，主容器自动使用 CPU。
      - /dev/accel:/dev/accel
    device_cgroup_rules:
      - "c 261:* rmw"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
