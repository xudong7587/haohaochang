# 自动生成自 docker-compose.yaml；修改后运行 node scripts/render-compose.mjs。
# ARM64 NAS：docker compose -f docker-compose.arm64.yaml up -d
# 包含主程序与 CPU；Intel NPU 镜像仅支持 x86-64。
# 日常仅升级主程序：docker compose -f docker-compose.arm64.yaml pull ktv && docker compose -f docker-compose.arm64.yaml up -d --no-deps ktv
x-worker: &worker
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  depends_on:
    ktv:
      condition: service_healthy
  volumes:
    - ${KTV_DATA_DIR:-./data}:/data
  # 主程序首次启动生成密钥；旧模型、缓存与任务目录继续复用。
  command:
    - sh
    - -ec
    - |
      until [ -s /data/separation/internal.key ]; do sleep 1; done
      export SEPARATION_API_KEY="$$(cat /data/separation/internal.key)"
      test "$${#SEPARATION_API_KEY}" -eq 64
      if [ -d /data/separator/models ]; then export TORCH_HOME=/data/separator/models; fi
      if [ -d /data/npu/npu-cache ]; then export NPU_CACHE_DIR=/data/npu/npu-cache; fi
      exec nice -n 10 python -m uvicorn app:app --host 0.0.0.0 --port 8000 --no-access-log
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "from pathlib import Path; import urllib.request; key=Path('/data/separation/internal.key').read_text().strip(); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health',headers={'Authorization':'Bearer '+key}),timeout=5)"
    interval: 30s
    timeout: 10s
    start_period: 60s
    retries: 3
x-worker-env: &worker-env
  SEPARATION_CONCURRENCY: "1"
  SEPARATION_TIMEOUT_SECONDS: "21600"
  SEPARATION_SEGMENT: "4"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  PYTHONUNBUFFERED: "1"
services:
  ktv:
    image: ${KTV_IMAGE:-ghcr.io/xudong7587/haohaochang:latest}
    # 保留 PC / TV 自动发现；分离服务只在同机回环地址开放。
    network_mode: host
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password-123}
      PORT: ${KTV_PORT:-43210}
      KTV_DISCOVERY_ENABLED: "1"
      KTV_TV_DISCOVERY_ENABLED: "1"
      KTV_LOCAL_SEPARATION: "1"
      KTV_CPU_ENDPOINT: http://127.0.0.1:18002
    volumes:
      - ${KTV_DATA_DIR:-./data}:/data
      - ${KTV_MEDIA_DIR:-/volume3/V3 Media/Haohaochang/media}:/media
      - ${KTV_DOWNLOAD_DIR:-/volume3/V3 Media/Haohaochang/download}:/download
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
  separator-cpu:
    <<: *worker
    # 独立固定版本和摘要，日常 Release 不更新此镜像。
    image: ghcr.io/xudong7587/haohaochang-separator:1.0.8@sha256:c69112be880d34c31c1366657da5743a4594121428596822036a4b61029ac2d7
    ports:
      - "127.0.0.1:18002:8000"
    environment:
      <<: *worker-env
      SEPARATION_BACKEND: demucs
      SEPARATION_DEVICE: cpu
      SEPARATION_DATA_DIR: /data/separation/demucs
      TORCH_HOME: /data/models
