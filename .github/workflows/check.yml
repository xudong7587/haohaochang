name: Validate and build
on: [push, pull_request, workflow_dispatch]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test
        timeout-minutes: 3
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-check.mjs
        timeout-minutes: 3
      - run: node tests/library-ui.browser.mjs
        timeout-minutes: 3
      - run: node tests/online-player.browser.mjs
        timeout-minutes: 3
      - run: node tests/feedback.browser.mjs
        timeout-minutes: 3
      - run: node tests/pc-dashboard.browser.mjs
        timeout-minutes: 3
      - run: node scripts/player-check.mjs
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: test-results/
      - run: docker build -t haohaochang:test .
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/bili-preprocess/test.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/launcher-check.ps1
        timeout-minutes: 2
  worker-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install fastapi==0.115.12 python-multipart==0.0.20 httpx
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s separator -p test_protocol.py
      - run: python -m unittest discover -s separator -p test_concurrency.py
      - run: python -m unittest discover -s pc-worker -p test_lan.py
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: haohaochang-tv-debug
          path: android/app/build/outputs/apk/debug/*.apk
