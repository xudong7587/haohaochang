name: Validate and build
on: [push, pull_request, workflow_dispatch]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm test
        timeout-minutes: 3
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ui-check.mjs
        timeout-minutes: 3
      - run: node tests/room-browsing.browser.mjs
        timeout-minutes: 3
      - run: node tests/library-ui.browser.mjs
        timeout-minutes: 3
      - run: node tests/online-player.browser.mjs
        timeout-minutes: 3
      - run: node tests/tv-pairing.browser.mjs
        timeout-minutes: 3
      - run: node tests/feedback.browser.mjs
        timeout-minutes: 3
      - run: node tests/pc-worker-ui.browser.mjs
        timeout-minutes: 3
      - run: node tests/poster.browser.mjs
        timeout-minutes: 3
      - run: node tests/artist-artwork.browser.mjs
        timeout-minutes: 3
      - run: node tests/poster-editor.browser.mjs
        timeout-minutes: 3
      - run: node tests/pc-dashboard.browser.mjs
        timeout-minutes: 3
      - run: node tests/player-lease.browser.mjs
        timeout-minutes: 3
      - run: node tests/adaptive-player.browser.mjs
        timeout-minutes: 3
      - run: node tests/native-player.browser.mjs
        timeout-minutes: 3
      - run: node scripts/player-check.mjs
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: test-results/
      - run: docker build -t haohaochang:test .
      - name: Verify NAS cover processing and TV startup assets
        run: docker run --rm -v "$PWD/scripts:/app/scripts:ro" haohaochang:test node scripts/check-poster-runtime.mjs
      - name: Verify integrated CPU fallback without NPU
        timeout-minutes: 12
        run: |
          docker run -d --name embedded-verify -e ADMIN_PASSWORD=ci-embedded-password-123 -e KTV_EMBEDDED_KEY=ci-ephemeral-worker-key -e KTV_LOCAL_ONLY=1 -v "$PWD/scripts:/app/scripts:ro" -v /dev/accel:/dev/accel --device-cgroup-rule='c 261:* rmw' haohaochang:test
          for n in $(seq 1 30); do
            if docker exec embedded-verify node -e "fetch('http://127.0.0.1:3210/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then break; fi
            sleep 2
          done
          docker exec embedded-verify /opt/separator/bin/python scripts/check-separator-runtime.py
          docker exec embedded-verify node scripts/check-embedded-runtime.mjs
      - name: Integrated container logs
        if: always()
        run: docker logs embedded-verify || true
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/bili-preprocess/test.ps1
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/launcher-check.ps1
        timeout-minutes: 2
  worker-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install fastapi==0.115.12 python-multipart==0.0.20 httpx psutil==7.0.0 numpy==1.26.4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s separator -p test_protocol.py
      - run: python -m unittest discover -s separator -p test_concurrency.py
      - run: python -m unittest discover -s separator -p test_npu.py
      - run: python -m unittest discover -s pc-worker -p test_lan.py
      - run: python -m unittest discover -s pc-worker -p 'test_update*.py'
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.4.1'}
      - run: gradle -p android testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tv-validation
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/test-screenshots/
      - name: Build signed TV update
        if: github.event_name != 'pull_request'
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: |
          test -n "$TV_KEYSTORE_BASE64"
          export TV_KEYSTORE_FILE="$RUNNER_TEMP/tv-release.p12"
          printf '%s' "$TV_KEYSTORE_BASE64" | base64 --decode > "$TV_KEYSTORE_FILE"
          gradle -p android assembleRelease
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          test -n "$version"
          echo "TV_VERSION=$version" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "haohaochang-tv-v$version.apk"
          rm -f "$TV_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: haohaochang-tv-v${{ env.TV_VERSION }}
          path: haohaochang-tv-v${{ env.TV_VERSION }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: haohaochang-tv-debug
          path: android/app/build/outputs/apk/debug/*.apk
