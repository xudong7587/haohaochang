name: Publish NAS main image
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
env:
  IMAGE_REPOSITORY: ghcr.io/xudong7587/haohaochang
jobs:
  publish:
    if: ${{ !contains(github.ref_name, '.rc') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            suffix: ''
            dockerfile: Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - context: .
            suffix: ''
            dockerfile: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=${IMAGE_REPOSITORY}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix || 'ktv' }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix || 'ktv' }}-${{ matrix.arch }}
      - name: Verify published main image and Compose
        env:
          KTV_TEST_IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker pull "$KTV_TEST_IMAGE"
          test "$(docker image inspect "$KTV_TEST_IMAGE" --format '{{.Architecture}}')" = "$ARCH"
          docker image inspect "$KTV_TEST_IMAGE" --format 'Main image unpacked bytes: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
          docker run --rm -v "$PWD/scripts:/app/scripts:ro" "$KTV_TEST_IMAGE" node scripts/check-poster-runtime.mjs
          sh scripts/check-compose-runtime.sh
  promote:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '.rc') && !contains(github.ref_name, '-') }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified architecture manifests
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          image="$IMAGE_REPOSITORY"
          docker buildx imagetools create -t "$image:$GITHUB_REF_NAME" -t "$image:${GITHUB_REF_NAME#v}" -t "$image:sha-$GITHUB_SHA" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --raw > manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | unique == ["amd64","arm64"]' manifest.json
          docker buildx imagetools create -t "$image:latest" "$image:$GITHUB_REF_NAME"
