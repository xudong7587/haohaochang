name: Publish NAS images
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            suffix: ''
          - context: ./separator
            suffix: '-separator'
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.suffix || 'ktv' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix || 'ktv' }}
      - name: Verify published container
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          KIND: ${{ matrix.suffix }}
        run: |
          docker pull "$IMAGE"
          if [ -z "$KIND" ]; then
            docker run -d --name verify -e ADMIN_PASSWORD=ci-smoke-password-123 -p 3210:3210 "$IMAGE"
            for n in $(seq 1 20); do
              if curl -fsS http://localhost:3210/api/health; then break; fi
              sleep 2
            done
            curl -fsS http://localhost:3210/api/health
            docker exec verify node -e "const c=JSON.parse(require('fs').readFileSync('/data/settings.json'));if(c.version!==1)process.exit(1);console.log('settings.json initialized')"
            docker exec verify ffmpeg -version
            docker exec verify /opt/ytdlp/bin/yt-dlp --version
            docker cp scripts/check-poster-runtime.mjs verify:/app/check-poster-runtime.mjs
            docker exec verify mkdir -p /app/scripts
            docker exec verify mv /app/check-poster-runtime.mjs /app/scripts/check-poster-runtime.mjs
            docker exec verify node scripts/check-poster-runtime.mjs
          else
            docker run -d --name verify -p 8000:8000 "$IMAGE"
            for n in $(seq 1 20); do
              if curl -fsS http://localhost:8000/health; then break; fi
              sleep 2
            done
            curl -fsS http://localhost:8000/health
          fi
      - name: Container logs
        if: always()
        run: docker logs verify || true
  promote:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified images to latest
        run: |
          for suffix in '' '-separator'; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}${suffix}"
            docker buildx imagetools create -t "$image:latest" "$image:sha-$GITHUB_SHA"
          done
