name: Publish NPU preview (never latest)
on:
  push:
    tags: ['v*.rc*']
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy==1.26.4 fastapi==0.115.12 python-multipart==0.0.20 httpx
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s separator -p 'test_*.py'
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: .
            file: Dockerfile
            suffix: ''
          - context: ./separator
            file: separator/Dockerfile.npu
            suffix: '-separator-npu'
    steps:
      - uses: actions/checkout@v4
      - name: Explicit preview tags only
        id: image
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.rc[0-9]+$ ]] || exit 1
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=npu-preview${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=npu-preview${{ matrix.suffix }}
      - name: Verify preview runtime
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          KIND: ${{ matrix.suffix }}
        run: |
          if [ -z "$KIND" ]; then
            docker run -d --name verify -e ADMIN_PASSWORD=ci-preview-password-123 -p 3210:3210 "$IMAGE"
            for n in $(seq 1 30); do curl -fsS http://localhost:3210/api/health && break || sleep 2; done
            curl -fsS http://localhost:3210/api/health
          else
            docker run -d --name verify -p 8000:8000 "$IMAGE"
            for n in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 2; done
            curl -fsS http://localhost:8000/health | python -c 'import json,sys; v=json.load(sys.stdin); assert v["backend"]=="openvino-npu"; assert v["ready"] is False'
          fi
      - name: Logs
        if: always()
        run: docker logs verify || true
